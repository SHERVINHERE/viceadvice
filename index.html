<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>ViceAdvice</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="style.css?v=2" />
  <link rel="stylesheet" href="assets/finder.css?v=1" />
</head>
<body>
  <!-- Centered cover image (picked by the script below). The page never scrolls. -->
  <main class="wrap" id="stage">
    <img class="hero" alt="ViceAdvice cover image" />
  </main>

  <!-- Hidden search: invisible until someone starts typing, then fades in over the page -->
  <div class="finder" id="finder">
    <form class="search" id="search-form" role="search" autocomplete="off">
      <label for="q" class="visually-hidden">Search</label>
      <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
      <input id="q" name="q" type="search" spellcheck="false" autocomplete="off" autocapitalize="off" autofocus role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="search-results" />
      <div id="search-results" class="search-results" role="listbox" aria-live="polite"></div>
    </form>
  </div>

  <!-- Weighted random cover.
       Settings: media/covers.json -> { "images": [ { "file": "cover1.jpg", "weight": 5 } ] }
       weight = chance 0-10 (0 = never shown, 10 = most likely). -->
  <script>
    (function () {
      const img = document.querySelector('.hero');
      if (!img) return;
      const FALLBACK = 'media/cover1.jpg';

      function show(src) {
        img.onerror = () => { img.onerror = null; img.src = FALLBACK; };
        img.src = src;
      }

      function pick(list) {
        const items = (list || []).filter(i => i && i.file && Number(i.weight) > 0);
        const total = items.reduce((s, i) => s + Math.min(10, Number(i.weight)), 0);
        if (!total) return null;
        let r = Math.random() * total;
        for (const i of items) {
          r -= Math.min(10, Number(i.weight));
          if (r < 0) return 'media/' + i.file;
        }
        return 'media/' + items[items.length - 1].file;
      }

      fetch('media/covers.json', { cache: 'no-store' })
        .then(r => r.ok ? r.json() : null)
        .then(cfg => show(pick(cfg && cfg.images) || FALLBACK))
        .catch(() => show(FALLBACK));
    })();
  </script>
  <script defer src="assets/search.js?v=1"></script>
  <script defer src="assets/finder.js?v=1"></script>
</body>
</html>
